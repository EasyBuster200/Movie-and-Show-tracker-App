<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script type="text/javascript" src="auth.js" defer></script>
  <script type="text/javascript" src="login.js" defer></script>
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1 class="logo">EasyBuster200</h1>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">Sign In</button>
      <button type="button" class="auth-tab" data-mode="signup">Create Account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email<input type="email" name="email" required></label>
      <label>Password<input type="password" name="password" required></label>
      <button type="submit">Sign In</button>
    </form>

    <form id="signup-form" class="auth-form" hidden>
      <label>Display Name<input type="text" name="displayName" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Password<input type="password" name="password" required minlength="8"></label>
      <button type="submit">Create Account</button>
    </form>

    <p id="auth-error" class="auth-error" hidden></p>
  </div>
</body>
</html>
