<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}</style>
</head>
<body>
<div id="root" class="tt-root" style="padding:16px"></div>
<script>
var h = React.createElement, T = window.TVTracker;
function Row(p){return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'12px 14px',background:'var(--bg-card)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-md)'}},h('span',{style:{fontSize:14,fontWeight:500}},p.label),h(T.Switch,{label:p.label,checked:p.on}));}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{maxWidth:360,display:'flex',flexDirection:'column',gap:8}},h(Row,{label:'New episodes',on:true}),h(Row,{label:'Weekly recap',on:false})));
</script>
</body>
</html>
