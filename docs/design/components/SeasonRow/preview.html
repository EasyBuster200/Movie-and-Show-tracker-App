<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary)}</style>
</head>
<body>
<div id="root" class="tt-root" style="padding:16px"></div>
<script>
var h = React.createElement, T = window.TVTracker;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{maxWidth:360,display:'flex',flexDirection:'column',gap:8}},
  h(T.SeasonRow,{label:'Season 1',watched:8,total:8}),
  h(T.SeasonRow,{label:'Season 2',watched:4,total:9}),
  h(T.SeasonRow,{label:'Season 3',watched:0,total:8})));
</script>
</body>
</html>
