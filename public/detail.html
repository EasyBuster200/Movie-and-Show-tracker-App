<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Details</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/detail.js" defer></script>
</head>
<body>
  <main class="screen screen--flush">
    <div class="detail-hero" id="detail-hero">
      <button type="button" class="tt-back" data-back="main.html" aria-label="Back">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      </button>
    </div>

    <div class="detail-head">
      <div id="detail-poster" class="tt-poster__art"></div>
      <div class="detail-head__info">
        <h1 id="detail-title"></h1>
        <span class="detail-head__meta" id="detail-meta"></span>
        <span class="detail-head__rating" id="detail-rating" hidden></span>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-actions" id="detail-actions"></div>

      <div class="stack-sm">
        <p class="detail-overview clamp" id="detail-overview"></p>
        <button type="button" class="tt-link" id="overview-toggle" hidden>Show more</button>
      </div>

      <section class="stack" id="seasons-section" hidden>
        <div class="seasons-head">
          <h2 class="section-title">Seasons</h2>
          <span class="muted-note" id="show-progress-label"></span>
        </div>
        <div id="show-progress-bar"></div>
        <div class="stack-sm" id="season-rows"></div>
      </section>

      <section class="stack" id="cast-section">
        <div class="tt-section"><h2>Cast</h2><button type="button" class="tt-link" id="cast-toggle" hidden>See all</button></div>
        <div class="cast-row" id="cast-list"></div>
      </section>

      <section class="stack" id="collection-section" hidden>
        <div class="tt-section"><h2 id="collection-title">Collection</h2></div>
        <div class="poster-row" id="collection-list"></div>
      </section>

      <section class="stack" id="similar-section" hidden>
        <div class="tt-section"><h2>More Like This</h2><a class="tt-link" id="similar-see-all" href="#">See all</a></div>
        <div class="poster-row" id="similar-list"></div>
      </section>
    </div>
  </main>
  <nav class="tt-nav" id="bottom-nav" data-active="home"></nav>
</body>
</html>
