<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/profile.js" defer></script>
</head>
<body>
  <main class="screen">
    <section class="profile-card" aria-label="Profile">
      <div class="profile-card__main">
        <div class="profile-card__avatar" id="profile-avatar" aria-hidden="true"></div>
        <div class="profile-card__name">
          <h1 id="profile-name"></h1>
          <span class="screen-subtitle" id="profile-since"></span>
        </div>
        <a href="settings.html" class="tt-btn tt-btn--ghost tt-btn--icon profile-card__menu" aria-label="Settings">
          <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path><path d="M3.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path><path d="M17.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path></svg>
        </a>
      </div>
      <div class="profile-card__status" id="backup-status" hidden>
        <span class="profile-card__status-icon" id="backup-status-icon">
          <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"></path><path d="M9.5 13.5l2 2 3.5-3.5"></path></svg>
        </span>
        <div class="profile-card__status-text">
          <span class="profile-card__status-title" id="backup-status-title"></span>
          <span class="profile-card__status-detail" id="backup-status-detail"></span>
        </div>
      </div>
    </section>

    <section class="stack" aria-labelledby="profile-stats-title">
      <div class="tt-section"><h2 id="profile-stats-title">Stats</h2><a class="tt-link" href="stats.html">See all</a></div>
      <div class="stat-grid" id="stats-grid"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Watched Movies</h2><a class="tt-link" href="media-list.html?source=watched&amp;type=movie">See all</a></div>
      <div class="poster-row" id="watched-movies-container"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Favourite Movies</h2><a class="tt-link" href="media-list.html?source=favorites&amp;type=movie">See all</a></div>
      <div class="poster-row" id="favorite-movies-container"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Watched Shows</h2><a class="tt-link" href="media-list.html?source=watched&amp;type=tv">See all</a></div>
      <div class="poster-row" id="watched-shows-container"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Favourite Shows</h2><a class="tt-link" href="media-list.html?source=favorites&amp;type=tv">See all</a></div>
      <div class="poster-row" id="favorite-shows-container"></div>
    </section>
  </main>
  <nav class="tt-nav" data-active="profile"></nav>
</body>
</html>
