<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/search-results.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header__row">
      <button type="button" class="tt-back" data-back="main.html" aria-label="Back">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      </button>
      <label class="tt-search" style="flex-grow: 1; min-width: 0">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20.5 20.5l-4.5-4.5"></path></svg>
        <span class="tt-sr">Search</span>
        <input type="search" id="search-page-input" placeholder="Search movies and shows…" autocomplete="off" enterkeyhint="search">
      </label>
    </div>
    <div class="chip-row" role="group" aria-label="Show" id="search-chips"></div>
  </header>
  <main class="page-body">
    <span class="muted-note" id="search-summary"></span>
    <div class="empty-state" id="search-empty" hidden style="margin-top: 0; background: transparent; border: 0">
      <h2>No matches</h2>
      <p>Try a shorter word, or check the spelling.</p>
    </div>
    <div class="media-rows" id="search-results-list"></div>
    <nav class="pager" id="search-results-pagination"></nav>
  </main>
  <nav class="tt-nav" data-active="home"></nav>
</body>
</html>
