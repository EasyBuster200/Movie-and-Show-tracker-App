<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Watchlist</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/bookmarks.js" defer></script>
</head>
<body>
  <main class="screen screen--tight">
    <div class="title-block">
      <h1 class="screen-title">Watchlist</h1>
      <span class="screen-subtitle" id="watchlist-count">&nbsp;</span>
    </div>
    <label class="tt-search">
      <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20.5 20.5l-4.5-4.5"></path></svg>
      <span class="tt-sr">Search your watchlist</span>
      <input type="search" id="watchlist-search" placeholder="Search your watchlist…" autocomplete="off">
    </label>

    <section class="stack">
      <div class="tt-section"><h2 id="watchlist-movies-title">Movies</h2><a class="tt-link" id="watchlist-movies-all" href="#">See all</a></div>
      <p class="empty-note" id="watchlist-movies-empty" hidden>No movies here. Tap the bookmark on any poster to save it for later.</p>
      <div class="poster-row" id="bookmarks-movies"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2 id="watchlist-shows-title">Shows</h2><a class="tt-link" id="watchlist-shows-all" href="#">See all</a></div>
      <p class="empty-note" id="watchlist-shows-empty" hidden>No shows here. Tap the bookmark on any poster to save it for later.</p>
      <div class="poster-row" id="bookmarks-shows"></div>
    </section>
  </main>
  <nav class="tt-nav" data-active="watchlist"></nav>
</body>
</html>
