<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Home</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/search.js" defer></script>
  <script type="text/javascript" src="scripts/app.js" defer></script>
</head>
<body>
  <main class="screen">
    <div class="search-bar">
      <label class="tt-search">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20.5 20.5l-4.5-4.5"></path></svg>
        <span class="tt-sr">Search</span>
        <input type="search" id="search-input" placeholder="Search movies and shows…" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="search-results" id="search-results" hidden></div>
    </div>

    <section class="stack">
      <div class="tt-section"><h2>Continue Watching</h2><a class="tt-link" href="media-list.html?source=watched&amp;type=tv&amp;filter=watching">See all</a></div>
      <div class="media-rows" id="continue-watching"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Airing Soon</h2><a class="tt-link" href="airing-soon.html">See all</a></div>
      <div class="media-rows" id="airing-soon"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Trending Shows</h2><a class="tt-link" href="media-list.html?source=trending&amp;type=tv">See all</a></div>
      <div class="poster-row" id="trending-shows"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Trending Movies</h2><a class="tt-link" href="media-list.html?source=trending&amp;type=movie">See all</a></div>
      <div class="poster-row" id="trending-movies"></div>
    </section>
  </main>
  <nav class="tt-nav" data-active="home"></nav>
</body>
</html>
