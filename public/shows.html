<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shows</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/search.js" defer></script>
  <script type="text/javascript" src="scripts/browse.js" defer></script>
  <script type="text/javascript" src="scripts/shows.js" defer></script>
</head>
<body>
  <main class="screen">
    <div class="stack">
      <h1 class="screen-title">Shows</h1>
      <div class="search-bar">
        <label class="tt-search">
          <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path><path d="M20.5 20.5l-4.5-4.5"></path></svg>
          <span class="tt-sr">Search shows</span>
          <input type="search" id="search-input" data-search-type="tv" placeholder="Search shows…" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </div>

    <section class="stack">
      <div class="tt-section"><h2>Popular</h2><a class="tt-link" href="media-list.html?source=popular&amp;type=tv">See all</a></div>
      <div class="poster-row" id="popular-shows"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Keep Watching</h2><a class="tt-link" href="media-list.html?source=watched&amp;type=tv&amp;filter=watching">See all</a></div>
      <div class="poster-row" id="keep-watching"></div>
    </section>

    <section class="stack">
      <div class="tt-section"><h2>Recommended</h2><a class="tt-link" href="media-list.html?source=recommended&amp;type=tv">See all</a></div>
      <div class="poster-row" id="recommended-shows"></div>
    </section>

    <section class="stack">
      <h2 class="section-title">Browse All Shows</h2>
      <div class="filter-card">
        <button type="button" class="filter-card__toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-panel">
          <span class="filter-card__icon"><svg class="tt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><path d="M16 5v4"></path><path d="M4 17h4"></path><path d="M12 17h8"></path><path d="M10 15v4"></path></svg></span>
          <span class="filter-card__text">
            <span class="filter-card__title">Filter &amp; sort</span>
            <span class="filter-card__summary" id="filter-summary">Popular · All genres</span>
          </span>
          <span class="filter-card__badge" id="filter-badge" hidden></span>
          <span class="filter-card__chevron"><svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
        </button>
        <div class="filter-card__panel" id="filter-panel" hidden>
          <div class="stack-sm">
            <span class="tt-filter-label">Sort by</span>
            <div class="chip-wrap" role="group" aria-label="Sort by" id="filter-sorts"></div>
          </div>
          <div class="filter-card__divider"></div>
          <div class="stack-sm">
            <div class="filter-card__group-head">
              <span class="tt-filter-label">Genres</span>
              <button type="button" class="tt-link" id="filter-clear" hidden>Clear</button>
            </div>
            <div class="chip-wrap" role="group" aria-label="Genres" id="filter-genres"></div>
          </div>
        </div>
      </div>
      <span class="muted-note" id="browse-result-label"></span>
      <p class="empty-note" id="browse-empty" hidden>Nothing matches these genres on this page. Try removing one.</p>
      <div class="poster-grid" id="browse-grid"></div>
      <nav class="pager" id="browse-pagination"></nav>
    </section>
  </main>
  <nav class="tt-nav" data-active="shows"></nav>
</body>
</html>
