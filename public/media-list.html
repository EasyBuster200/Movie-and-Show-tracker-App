<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>See all</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/style.css">
  <script type="text/javascript" src="scripts/theme.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-filesystem.js"></script>
  <script type="text/javascript" src="scripts/vendor/capacitor-local-notifications.js"></script>
  <script type="text/javascript" src="scripts/standardItem.js" defer></script>
  <script type="text/javascript" src="scripts/localDb.js" defer></script>
  <script type="text/javascript" src="scripts/localApi.js" defer></script>
  <script type="text/javascript" src="scripts/profiles.js" defer></script>
  <script type="text/javascript" src="scripts/backup.js" defer></script>
  <script type="text/javascript" src="scripts/autoBackup.js" defer></script>
  <script type="text/javascript" src="scripts/notifications.js" defer></script>
  <script type="text/javascript" src="scripts/auth.js" defer></script>
  <script type="text/javascript" src="scripts/media.js" defer></script>
  <script type="text/javascript" src="scripts/media-list.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header__row">
      <button type="button" class="tt-back" data-back="profile.html" aria-label="Back">
        <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      </button>
      <div class="page-header__titles">
        <h1 id="media-list-heading">&nbsp;</h1>
        <span class="page-header__eyebrow" id="media-list-count">&nbsp;</span>
      </div>
      <div class="menu" id="list-menu" style="margin-left: auto" hidden>
        <button type="button" class="tt-btn tt-btn--ghost tt-btn--icon" id="list-menu-btn" aria-label="List options" aria-haspopup="true">
          <svg class="tt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path><path d="M3.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path><path d="M17.5 12a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0z"></path></svg>
        </button>
        <div class="menu__list" id="list-menu-list" hidden>
          <button type="button" class="menu__item menu__item--danger" id="delete-list-btn">Delete this list</button>
        </div>
      </div>
    </div>
    <div class="chip-row" role="group" aria-label="Show" id="media-list-filters" hidden></div>
    <div class="chip-row" role="group" aria-label="Sort by" id="media-list-sorts" hidden></div>
  </header>
  <main class="page-body">
    <p class="empty-note" id="media-list-empty" hidden></p>
    <div class="poster-grid" id="media-list-grid"></div>
    <nav class="pager" id="media-list-pagination"></nav>
  </main>
  <nav class="tt-nav" id="bottom-nav" data-active="profile"></nav>
</body>
</html>
